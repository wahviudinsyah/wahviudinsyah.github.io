<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Portofolio Muchamad Syifa Wahviudinsyah – Finance Staff & Pasar Modal. Pengalaman, skill, project Excel, riset ekuitas, dan sertifikasi.">
<meta property="og:title" content="Portofolio Muchamad Syifa Wahviudinsyah">
<meta property="og:description" content="Lulusan Manajemen Keuangan UPN Veteran Yogyakarta · RTA BNSP · Finance & Pasar Modal">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Portofolio Muchamad Syifa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: annual-report restraint — quiet sidebar with text tabs, one panel at a time; hairline rules, one green accent, serif headings, mono figures */
:root{
  --bg:#fbfbf9; --side:#f3f4f1; --surface:#ffffff; --fg:#17211c; --muted:#687069; --line:#e2e4df; --soft:#f0f2ee;
  --accent:#1d6b47; --accent-ink:#ffffff; --accent-soft:#e6f0ea; --neg:#b4452f;
  --input:#fbf1c7; --input-fg:#584600; --chart2:#b9d6c5;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --side:#171c19; --surface:#1a201d; --fg:#e7ebe8; --muted:#97a19a; --line:#2b332e; --soft:#1f2622;
  --accent:#5cc292; --accent-ink:#0d1a13; --accent-soft:#1b2e24; --neg:#f08a72;
  --input:#463c12; --input-fg:#f6e49a; --chart2:#2f5a43; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --side:#171c19; --surface:#1a201d; --fg:#e7ebe8; --muted:#97a19a; --line:#2b332e; --soft:#1f2622;
  --accent:#5cc292; --accent-ink:#0d1a13; --accent-soft:#1b2e24; --neg:#f08a72;
  --input:#463c12; --input-fg:#f6e49a; --chart2:#2f5a43; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 .95rem/1.65 var(--f-body)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1,h2,h3{font-family:var(--f-display);font-weight:500;line-height:1.15;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.muted{color:var(--muted)}.small{font-size:.82rem}
.label{font:500 .7rem/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.rel{font-size:.72rem;color:var(--accent);font-weight:500;white-space:nowrap}

.app{display:grid;grid-template-columns:280px 1fr;min-height:100%}
.app>*{min-width:0}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:28px;padding-block:36px 28px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;overflow-y:auto}
.me{display:grid;gap:10px}
.me img{width:72px;height:72px;border-radius:50%;object-fit:cover}
.me h1{font-size:1.3rem}
.me .role{font-size:.85rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;justify-self:start;background:var(--surface);margin-top:6px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:.76rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tabs{display:grid;gap:1px}
.tabs button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:.92rem;color:var(--muted);transition:color .15s,background .15s}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);background:var(--surface);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.side-foot{margin-top:auto;display:grid;gap:8px;font-size:.8rem;color:var(--muted)}
.side-foot .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghostbtn{border:1px solid var(--line);background:none;cursor:pointer;padding:5px 10px;border-radius:6px;font-size:.75rem;color:var(--muted)}

.main{padding-block:56px 72px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.panel{max-width:820px;margin:0 auto;display:grid;gap:40px}
.ph{display:grid;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.ph h2{font-size:clamp(1.9rem,4vw,2.5rem)}
.ph p{color:var(--muted);max-width:58ch}
.block{display:grid;gap:16px}
.btn{border:1px solid var(--fg);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:999px;cursor:pointer;font-size:.85rem;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:none;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--fg)}
.textlink{border:0;background:none;color:var(--accent);font-size:.84rem;cursor:pointer;padding:0;font-weight:500}
.textlink:hover{text-decoration:underline;text-underline-offset:3px}

/* tentang */
.hero{display:grid;grid-template-columns:220px 1fr;gap:36px;align-items:stretch}
.hero>*{min-width:0}
.hero img{width:100%;max-width:100%;height:100%;min-height:300px;object-fit:cover;object-position:50% 25%;border-radius:4px;background:var(--soft)}
.hero .txt{display:grid;gap:16px;align-content:center}
.hero h2{font-size:clamp(2rem,4.4vw,2.9rem)}
.hero h2 em{font-style:italic;color:var(--accent)}
.hero .bio{max-width:60ch;color:var(--fg)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.ticker{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--fg)}
.ticker div{padding:16px 18px 14px;display:grid;gap:4px;border-right:1px solid var(--line)}
.ticker div:first-child{padding-left:0}
.ticker div:last-child{border-right:0}
.ticker .sym{font:500 .7rem var(--f-mono);letter-spacing:.06em;color:var(--muted)}
.ticker b{font:500 1.35rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.ticker small{font-size:.75rem;color:var(--muted)}
.dl{display:grid}
.dl .r{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.dl .r:first-child{border-top:1px solid var(--line)}
.dl .r span:first-child{color:var(--muted)}

/* pengalaman */
.xp{display:grid}
.xp-item{display:grid;grid-template-columns:150px 1fr;gap:6px 28px;padding:26px 0;border-bottom:1px solid var(--line)}
.xp-item:first-child{padding-top:0}
.xp-item .when{font:400 .78rem/1.5 var(--f-mono);color:var(--muted);padding-top:4px}
.xp-item .sector{display:block;font-size:.72rem;color:var(--muted);margin-top:4px;font-family:var(--f-body)}
.xp-item h3{font-size:1.3rem}
.xp-item .org{font-size:.88rem;color:var(--muted)}
.xp-item ul{margin:10px 0 0;padding-left:1.1em;display:grid;gap:5px;font-size:.9rem}
.xp-item ul li::marker{color:var(--accent)}
.xp-title{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.xp-links{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}

/* skill */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-block:1px solid var(--fg)}
.feat>*{min-width:0}
.fitem{border:0;background:none;text-align:left;cursor:pointer;padding:20px 20px 20px 0;display:grid;gap:8px;align-content:start;border-right:1px solid var(--line)}
.fitem+.fitem{padding-left:20px}
.fitem:last-child{border-right:0}
.fitem h3{font-size:1.25rem}
.fitem p{font-size:.84rem;color:var(--muted)}
.fitem .go{font-size:.78rem;color:var(--accent);font-weight:500}
.fitem:hover h3{color:var(--accent)}
.sgroups{display:grid;grid-template-columns:repeat(2,1fr);gap:36px 40px}
.sgroups>*{min-width:0}
.sg{display:grid;gap:4px;align-content:start}
.sg h3{font-size:1.15rem}
.sg .d{font-size:.82rem;color:var(--muted);margin-bottom:8px}
.sitem{border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;padding:11px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.sitem b{font-size:.9rem;font-weight:500}
.sitem span{font-size:.78rem;color:var(--muted);grid-column:1}
.sitem i{font-style:normal;color:var(--muted);grid-row:1/3;grid-column:2;align-self:center;transition:transform .15s,color .15s}
.sitem:hover b,.sitem:hover i{color:var(--accent)}
.sitem:hover i{transform:translateX(3px)}
.tools{font-size:.9rem;line-height:2}

/* project */
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between}
.filters .fl{display:flex;flex-wrap:wrap;gap:14px}
label.f{display:grid;gap:6px;font-size:.7rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.sel{font:400 .9rem var(--f-body);letter-spacing:0;text-transform:none;padding:9px 36px 9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);min-width:0;max-width:100%;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.plist{display:grid}
.prow{display:grid;grid-template-columns:1fr auto;gap:6px 24px;text-align:left;width:100%;cursor:pointer;background:none;border:0;border-bottom:1px solid var(--line);padding:24px 0}
.prow:first-child{border-top:1px solid var(--line)}
.prow .type{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:500}
.prow h3{font-size:1.35rem;transition:color .15s}
.prow:hover h3{color:var(--accent)}
.prow .meta{font-size:.8rem;color:var(--muted)}
.prow .sum{font-size:.88rem;color:var(--muted);max-width:64ch}
.prow .sk{font-size:.76rem;color:var(--muted);font-family:var(--f-mono)}
.prow .sk mark{background:var(--input);color:var(--input-fg);padding:0 3px;border-radius:2px}
.prow .go{font-size:.8rem;color:var(--accent);white-space:nowrap;align-self:center;font-weight:500}
.empty{padding:30px 0;color:var(--muted)}

/* detail */
.figs{display:flex;flex-wrap:wrap;gap:0;border-block:1px solid var(--fg)}
.figs div{padding:14px 26px 12px 0;margin-right:26px;border-right:1px solid var(--line);display:grid;gap:2px}
.figs div:last-child{border-right:0}
.figs b{font:500 1.25rem var(--f-mono);font-variant-numeric:tabular-nums}
.figs span{font-size:.74rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:32px}
.cols>*{min-width:0}
ul.clean{margin:0;padding-left:1.1em;display:grid;gap:6px;font-size:.9rem}
ul.clean li::marker{color:var(--accent)}
.how{display:grid}
.how-item{display:grid;gap:8px;padding:20px 0;border-top:1px solid var(--line)}
.how-item.hl{background:linear-gradient(90deg,var(--accent-soft),transparent);padding-inline:14px;margin-inline:-14px;border-radius:4px}
.how-item .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.how-item h4{font:500 1.05rem var(--f-display)}
.how-item .row span{font-size:.72rem;color:var(--muted)}
.how-item p{font-size:.88rem}
.fx{display:flex;border:1px solid var(--line);background:var(--surface);border-radius:4px;overflow:hidden;font:400 .78rem/1.5 var(--f-mono)}
.fx .cell{padding:7px 10px;border-right:1px solid var(--line);color:var(--muted);flex:none}
.fx .tg{padding:7px 9px;color:var(--accent);font-style:italic;border-right:1px solid var(--line);flex:none}
.fx code{padding:7px 10px;overflow-x:auto;white-space:nowrap;min-width:0;flex:1}
.demowrap{border:1px solid var(--line);border-radius:6px;padding:22px;background:var(--surface)}
.demo{display:grid;gap:12px}
.demo h4{font:500 1.05rem var(--f-display)}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
select.cellin,input.cellin{font:400 .86rem var(--f-mono);padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--input);color:var(--input-fg);min-width:0;letter-spacing:0;text-transform:none}
.sheet{overflow-x:auto}
table{border-collapse:collapse;font:400 .8rem var(--f-mono);width:100%;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;white-space:nowrap}
th{background:var(--soft);color:var(--muted);font-weight:500}
td.auto{background:var(--accent-soft)}
td.inp{background:var(--input);color:var(--input-fg)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem}
.flow span{padding:4px 9px;border-radius:3px}
.flow .i{background:var(--input);color:var(--input-fg)}.flow .a{background:var(--accent-soft);color:var(--accent)}
.flow em{font-style:normal;color:var(--muted)}
.ranges{display:flex;gap:2px;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;padding:2px}
.ranges button{border:0;background:none;padding:4px 12px;border-radius:999px;font:400 .76rem var(--f-mono);cursor:pointer;color:var(--muted)}
.ranges button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:400 11px var(--f-mono)}
.chart .lbl{fill:var(--fg)}
.stack{display:grid;gap:14px}

/* pendidikan */
.edu{display:grid;grid-template-columns:1fr auto;gap:10px 24px;align-items:end;padding-bottom:22px;border-bottom:1px solid var(--line)}
.edu h3{font-size:1.6rem}
.edu .figs{grid-column:1/-1;margin-top:8px}
.certs{display:grid}
.cert{display:grid;grid-template-columns:1fr auto;gap:2px 20px;padding:13px 0;border-bottom:1px solid var(--line)}
.cert:first-child{border-top:1px solid var(--line)}
.cert b{font-weight:500;font-size:.92rem}
.cert span{font-size:.8rem;color:var(--muted)}
.cert .yr{font:400 .78rem var(--f-mono);color:var(--muted);grid-row:1/3;grid-column:2;align-self:center;text-align:right}
.cert.star b{font-family:var(--f-display);font-size:1.2rem}
.cert.star .yr{color:var(--accent)}
.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.docs>*{min-width:0}
.doc{border:0;background:none;padding:0;cursor:zoom-in;text-align:left;display:grid;gap:10px}
.doc img{width:100%;max-width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 24px -14px rgba(0,0,0,.35);transition:transform .2s}
.doc:hover img{transform:translateY(-3px)}
.doc b{font-weight:500;font-size:.9rem;display:block}
.doc span{font-size:.78rem;color:var(--muted)}
.lb{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.82);display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb[hidden]{display:none}
.lb figure{margin:0;display:grid;gap:12px;max-width:min(960px,100%)}
.lb img{max-width:100%;max-height:78vh;border-radius:3px;justify-self:center}
.lb figcaption{color:#e8ece9;font-size:.86rem;text-align:center}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.8rem}

/* kontak */
.ct-hero h2{font-size:clamp(2.2rem,5vw,3.2rem)}
.ct-hero h2 em{font-style:italic;color:var(--accent)}
.clist{display:grid}
.crow{display:grid;grid-template-columns:160px 1fr auto;gap:12px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.crow:first-child{border-top:1px solid var(--fg)}
.crow .v{font-family:var(--f-display);font-size:1.25rem;user-select:all;word-break:break-all}
.copy{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-size:.75rem;cursor:pointer;color:var(--muted);text-decoration:none;white-space:nowrap}
.copy:hover{border-color:var(--fg);color:var(--fg)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:5;gap:10px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .me{grid-template-columns:42px 1fr;align-items:center;gap:0 12px}
  .me img{width:42px;height:42px;grid-row:span 2}
  .me h1{font-size:1rem}.me .role{font-size:.78rem}
  .me .seg{grid-column:1/-1;margin-top:10px}
  .tabs{display:flex;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{white-space:nowrap;border-radius:0;box-shadow:none!important;background:none!important;border-bottom:2px solid transparent;padding:10px 12px}
  .tabs button[aria-selected="true"]{border-bottom-color:var(--fg)}
  .side-foot{display:none}
  .main{padding-block:32px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:640px){
  .hero{grid-template-columns:1fr;gap:22px}.hero img{max-width:220px;height:auto;aspect-ratio:3/4;min-height:0}
  .ticker{grid-template-columns:repeat(2,1fr)}.ticker div{padding-left:0}.ticker div:nth-child(2){border-right:0}.ticker div:nth-child(-n+2){border-bottom:1px solid var(--line)}.ticker div:nth-child(even){padding-left:16px}
  .dl .r{grid-template-columns:1fr;gap:0}
  .xp-item{grid-template-columns:1fr}
  .feat{grid-template-columns:1fr}.fitem,.fitem+.fitem{padding:18px 0;border-right:0;border-bottom:1px solid var(--line)}.fitem:last-child{border-bottom:0}
  .sgroups,.cols,.docs{grid-template-columns:1fr}
  .prow{grid-template-columns:1fr}.prow .go{display:none}
  .crow{grid-template-columns:1fr auto}.crow .label{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">

const rp=n=>"Rp "+n.toLocaleString("id-ID");
const usd=n=>(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const sname=id=>SKILLS.find(s=>s.id===id).name;
let track="finance",tab="tentang",ftype="all",fskill="all",detail=null,range="2017";

function renderChrome(){
  document.querySelectorAll("[data-track]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.track===track)));
  $("#sideRole").textContent=TRACKS[track].role;
  $("#tabs").innerHTML=TABS.map(([id,l])=>`<button role="tab" data-tab="${id}" aria-selected="${tab===id}">${l}</button>`).join("");
}
function render(){
  renderChrome();
  $("#panel").innerHTML={tentang,pengalaman,skill,project,pendidikan,kontak}[tab]();
  const d=$("#panel [data-demo]");if(d)DEMOS[d.dataset.demo](d);
}
const head=(t,s)=>`<header class="ph"><span class="label">${TRACKS[track].role}</span><h2>${t}</h2>${s?`<p>${s}</p>`:""}</header>`;

function tentang(){const T=TRACKS[track];return `
  <div class="hero"><img src="${PORTRAIT}" alt="Foto Muchamad Syifa Wahviudinsyah" width="450" height="600">
   <div class="txt"><span class="label">${T.role}</span><h2>Muchamad Syifa <em>Wahviudinsyah</em></h2>
    <p class="bio">${T.bio}</p>
    <div class="actions"><button class="btn" data-tab="project">Lihat project</button><button class="btn ghost" data-tab="kontak">Hubungi saya</button></div></div></div>
  <div class="ticker"><div><span class="sym">IPK</span><b>3,58</b><small>dari 4,00 · UPN Veteran Yk</small></div><div><span class="sym">RTA</span><b>BNSP</b><small>Technical Analyst · s.d. 2029</small></div><div><span class="sym">MWISE</span><b>300+</b><small>anggota komunitas</small></div><div><span class="sym">SFAIR</span><b>#1</b><small>Stock Fair KSPM 2024</small></div></div>
  <div class="block"><span class="label">Sekilas</span><div class="dl">${T.details.map(([k,v])=>`<div class="r"><span>${k}</span><span>${v}</span></div>`).join("")}</div></div>`}

function pengalaman(){return head("Pengalaman","Lima peran di pemerintahan, sekolah, organisasi kampus, dan komunitas, diurutkan dari yang terbaru.")+
  `<div class="xp">${EXP.map((e,i)=>`<div class="xp-item"><span class="when">${e.when}<span class="sector">${SECTOR[i]}</span></span><div>
   <div class="xp-title"><h3>${e.title}</h3>${e.tracks[0]===track?`<span class="rel">● Relevan</span>`:""}</div>
   <span class="org">${e.org}</span><ul>${e.pts.map(p=>`<li>${p}</li>`).join("")}</ul>
   ${e.proj||EXPDOC[i]?`<div class="xp-links">${e.proj?`<button class="textlink" data-open="${e.proj}">Lihat project terkait →</button>`:""}${EXPDOC[i]?`<button class="textlink" data-doc="${EXPDOC[i]}">Lihat sertifikat →</button>`:""}</div>`:""}</div></div>`).join("")}</div>`}

function skill(){return head("Skill","Apa yang bisa saya kerjakan, beserta bukti di mana saya memakainya. Klik skill untuk membuka project terkait.")+
  `<div class="block"><span class="label">Skill unggulan untuk ${TRACKS[track].role}</span><div class="feat">${FEAT[track].map(id=>`<button class="fitem" data-skill="${id}"><h3>${sname(id)}</h3><p>${EV[id]}</p><span class="go">Lihat project →</span></button>`).join("")}</div></div>
  <div class="sgroups">${GROUP_ORDER[track].map(g=>`<div class="sg"><h3>${GROUPS[g]}</h3><p class="d">${GDESC[g]}</p>${SKILLS.filter(s=>s.g===g).map(s=>`<button class="sitem" data-skill="${s.id}"><b>${s.name}</b><span>${EV[s.id]}</span><i>→</i></button>`).join("")}</div>`).join("")}</div>
  <div class="block"><span class="label">Tools</span><p class="tools">Microsoft Excel (Advanced) · Word · PowerPoint · Google Spreadsheet · Google Docs · EViews 13 · Stockbit · TradingView · TradingEconomics</p></div>`}

function visible(){return PROJECTS.filter(p=>(ftype==="all"||PTYPE[p.id]===ftype)&&(fskill==="all"||p.skills.includes(fskill)))
  .sort((a,b)=>(b.tracks[0]===track)-(a.tracks[0]===track)||(b.tracks.includes(track))-(a.tracks.includes(track)))}
function project(){
  if(detail)return projectDetail(PROJECTS.find(p=>p.id===detail));
  const list=visible(),used=Object.keys(TYPES);
  return head("Project","Hasil kerja nyata, dari spreadsheet otomatis sampai riset saham.")+
  `<div class="filters"><div class="fl">
    <label class="f" for="ft">Jenis project<select class="sel" id="ft"><option value="all">Semua jenis (${PROJECTS.length})</option>${used.map(t=>`<option value="${t}" ${ftype===t?"selected":""}>${TYPES[t]} (${PROJECTS.filter(p=>PTYPE[p.id]===t).length})</option>`).join("")}</select></label>
    <label class="f" for="fs">Skill<select class="sel" id="fs"><option value="all">Semua skill</option>${GROUP_ORDER[track].map(g=>`<optgroup label="${GROUPS[g]}">${SKILLS.filter(s=>s.g===g).map(s=>`<option value="${s.id}" ${fskill===s.id?"selected":""}>${s.name}</option>`).join("")}</optgroup>`).join("")}</select></label>
   </div>${ftype!=="all"||fskill!=="all"?`<button class="textlink" id="reset">Hapus filter</button>`:""}</div>
  <div class="plist">${list.length?list.map(p=>`<button class="prow" data-open="${p.id}"><div style="display:grid;gap:6px">
     <span class="type">${TYPES[PTYPE[p.id]]}</span><h3>${p.title}</h3><span class="meta">${p.meta}</span><p class="sum">${p.sum}</p>
     <span class="sk">${p.skills.map(s=>s===fskill?`<mark>${sname(s)}</mark>`:sname(s)).join(" · ")}</span></div>
     <span class="go">${p.excel?"Rumus & demo →":"Detail →"}</span></button>`).join(""):`<p class="empty">Belum ada project untuk kombinasi filter ini.</p>`}</div>`}

function projectDetail(p){
  const how=p.how?(fskill!=="all"?[...p.how].sort((a,b)=>(b.s===fskill)-(a.s===fskill)):p.how):null;
  return `<button class="textlink" data-back style="justify-self:start">← Kembali ke daftar project</button>
  <header class="ph"><span class="label">${TYPES[PTYPE[p.id]]}</span><h2>${p.title}</h2><p>${p.meta}</p></header>
  <p style="max-width:64ch">${p.sum}</p>
  <div class="figs">${p.stats.map(([b,s])=>`<div><b>${b}</b><span>${s}</span></div>`).join("")}</div>
  ${p.excel?`<div class="cols"><div class="block"><span class="label">Masalah</span><p style="font-size:.9rem">${p.problem}</p></div>
    <div class="block"><span class="label">Hasil</span><ul class="clean">${p.result.map(r=>`<li>${r}</li>`).join("")}</ul></div></div>
    <div class="block"><span class="label">Cara membangunnya</span><div class="how">${how.map(h=>`<div class="how-item ${h.s===fskill?"hl":""}"><div class="row"><h4>${h.t}</h4><span>${sname(h.s)}</span></div><p>${h.x}</p><div class="fx"><span class="cell">${h.c}</span><span class="tg">fx</span><code>${esc(h.f)}</code></div></div>`).join("")}</div></div>
    <div class="block"><span class="label">Coba langsung</span><div class="demowrap" data-demo="${p.demo}"></div></div>`
  :`<div class="block"><span class="label">Yang dikerjakan</span><ul class="clean">${p.approach.map(a=>`<li>${a}</li>`).join("")}</ul><p class="small muted">Tools: ${p.tools}</p></div>
    <div class="block"><span class="label">Skill</span><p class="small mono muted">${p.skills.map(sname).join(" · ")}</p></div>`}`}

function pendidikan(){const [star,...rest]=CERTS;return head("Pendidikan & Sertifikasi","Dasar akademik di manajemen keuangan, diperkuat sertifikasi profesi, kursus terstruktur, dan penghargaan.")+
  `<div class="edu"><div class="stack" style="gap:6px"><span class="label">S1 Manajemen · Konsentrasi Keuangan</span><h3>UPN "Veteran" Yogyakarta</h3><p class="small muted">Skripsi: Pengaruh ESG Disclosure terhadap Kinerja Keuangan Perusahaan IDX ESG Leaders (2020–2024)</p></div><span class="mono small muted">2022 – 2026</span>
   <div class="figs"><div><b>3,58</b><span>IPK dari 4,00</span></div><div><b>463</b><span>English Proficiency Test, dari 677</span></div><div><b>47</b><span>emiten diteliti</span></div></div></div>
  <div class="block"><span class="label">Sertifikasi</span><div class="certs">
   <div class="cert star"><b>Registered Technical Analyst (RTA)</b><span>BNSP · LSP Pasar Modal</span><span class="yr">Feb 2026 – 2029</span></div>
   ${rest.map(([a,b])=>`<div class="cert"><b>${a.split("·")[0].trim()}</b><span>${(a.split("·")[1]||"").trim()}</span><span class="yr">${b}</span></div>`).join("")}</div></div>
  <div class="block"><span class="label">Penghargaan & dokumen</span><div class="docs">${Object.entries(DOCS).map(([k,d])=>`<button class="doc" data-doc="${k}"><img src="${d.img}" alt="${d.title}"><span><b>${d.title}</b>${d.sub}</span></button>`).join("")}</div></div>`}

/* demos */
function bosDemo(el){
  el.innerHTML=`<div class="demo"><div class="flow"><span class="i">Kode barang</span><em>→</em><span class="a">Nama · Satuan · Harga</span><em>+</em><span class="i">No. BPU</span><em>→</em><span class="a">SPM · BAST · SBBK</span><em>→</em><span class="a">Buku Pengeluaran</span><em>→</em><span class="a">Surat SBBK</span></div>
  <h4>Coba langsung: satu baris buku penerimaan</h4>
  <div class="controls">
   <label class="f" for="bk">Kode barang<select class="cellin" id="bk">${Object.keys(MASTER).map(k=>`<option>${k}</option>`).join("")}</select></label>
   <label class="f" for="bq">Banyaknya<input class="cellin" id="bq" inputmode="numeric" value="2" size="5"></label>
   <label class="f" for="bb">Nomor BPU<input class="cellin" id="bb" value="BPU01" size="8"></label>
   <label class="f" for="bt">Tanggal<input class="cellin" id="bt" type="date" value="2026-02-12"></label></div>
  <div class="sheet"><table><thead><tr><th>Kode</th><th>Nama barang</th><th>Satuan</th><th>Harga satuan</th><th>Jumlah harga</th></tr></thead><tbody id="bt1"></tbody></table></div>
  <div class="sheet"><table><thead><tr><th>Dokumen</th><th>Nomor otomatis</th><th>Dipakai di</th></tr></thead><tbody id="bt2"></tbody></table></div>
  <div class="legend"><span><i style="background:var(--input)"></i>diketik</span><span><i style="background:var(--accent-soft)"></i>hasil rumus</span></div></div>`;
  const g=id=>el.querySelector("#"+id);
  const run=()=>{const k=g("bk").value,[n,s,h]=MASTER[k],q=parseFloat(g("bq").value)||0,b=g("bb").value.trim()||"BPU01",d=g("bt").value?g("bt").value.split("-").reverse().join("/"):"";
    g("bt1").innerHTML=`<tr><td class="inp">${k}</td><td class="auto">${n}</td><td class="auto">${s}</td><td class="auto">${rp(h)}</td><td class="auto">${rp(q*h)}</td></tr>`;
    g("bt2").innerHTML=[["SPM","Buku Penerimaan · Dokumen/Faktur"],["BAST","Buku Penerimaan · Bukti Penerimaan"],["SBBK","Buku Pengeluaran & Surat SBBK"]].map(([c,u])=>`<tr><td>${c}</td><td class="auto">${esc(b)}/${c}/${d}</td><td>${u}</td></tr>`).join("")};
  el.querySelectorAll("select,input").forEach(i=>i.addEventListener("input",run));run();
}

function ssDemo(el){
  el.innerHTML=`<div class="demo stack">
   <div class="controls" style="justify-content:space-between"><h4>Tren sales bulanan vs rata-rata 4 tahun</h4><div class="ranges" id="rg"></div></div>
   <div class="legend"><span><i style="background:var(--accent)"></i>Tahun terpilih</span><span><i style="background:var(--muted)"></i>Rata-rata 2014–2017 (putus-putus)</span></div><div id="c3"></div>
   <hr style="border:0;border-top:1px solid var(--line);margin:6px 0">
   <h4>Sales vs profit per sub-kategori</h4><div class="legend"><span><i style="background:var(--chart2)"></i>Sales</span><span><i style="background:var(--accent)"></i>Profit</span><span><i style="background:var(--neg)"></i>Rugi</span></div><div id="c1"></div>
   <hr style="border:0;border-top:1px solid var(--line);margin:6px 0">
   <div class="controls" style="justify-content:space-between"><h4>Histogram jumlah order per nilai sales</h4><label class="f" for="hr">Region<select class="cellin" id="hr"><option>All</option><option>Central</option><option>East</option><option>South</option><option>West</option></select></label></div><div id="c2"></div></div>`;
  const W=640,rowH=21,top=6,left=90,H=SUB.length*rowH+top+22,max=340000,min=-20000,x=v=>left+(v-min)/(max-min)*(W-left-12);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales dan profit per sub-kategori">`;
  [0,100000,200000,300000].forEach(t=>s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H-18}" stroke="var(--line)"/><text x="${x(t)}" y="${H-5}" text-anchor="middle">${t?"$"+t/1000+"rb":"0"}</text>`);
  SUB.forEach(([n,sa,pr],i)=>{const y=top+i*rowH;s+=`<text class="lbl" x="${left-6}" y="${y+13}" text-anchor="end">${n}</text><rect x="${x(0)}" y="${y+2}" width="${x(sa)-x(0)}" height="9" fill="var(--chart2)"><title>${n} sales ${usd(sa)}</title></rect><rect x="${pr<0?x(pr):x(0)}" y="${y+11}" width="${Math.max(1,Math.abs(x(pr)-x(0)))}" height="6" fill="${pr<0?"var(--neg)":"var(--accent)"}"><title>${n} profit ${usd(pr)}</title></rect>`});
  el.querySelector("#c1").innerHTML=s+"</svg>";
  const drawH=()=>{const r=el.querySelector("#hr").value,v=r==="All"?HIST.bins.map((_,i)=>["Central","East","South","West"].reduce((a,k)=>a+HIST[k][i],0)):HIST[r];
    const W=640,H=220,l=44,b=30,t=16,mx=Math.ceil(Math.max(...v)/500)*500,bw=(W-l-6)/v.length;
    let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Histogram order ${r}">`;
    for(let g=0;g<=mx;g+=mx/4){const y=H-b-(g/mx)*(H-b-t);s+=`<line x1="${l}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${l-6}" y="${y+4}" text-anchor="end">${g.toLocaleString("id-ID")}</text>`}
    v.forEach((c,i)=>{const h=(c/mx)*(H-b-t),xx=l+i*bw+4;s+=`<rect x="${xx}" y="${H-b-h}" width="${bw-8}" height="${h}" rx="2" fill="var(--accent)"/><text class="lbl" x="${xx+(bw-8)/2}" y="${H-b-h-4}" text-anchor="middle">${c.toLocaleString("id-ID")}</text><text x="${xx+(bw-8)/2}" y="${H-b+15}" text-anchor="middle">${HIST.bins[i]}</text>`});
    el.querySelector("#c2").innerHTML=s+"</svg>"};
  const drawT=()=>{el.querySelector("#rg").innerHTML=["2014","2015","2016","2017"].map(r=>`<button data-range="${r}" aria-pressed="${r===range}">${r}</button>`).join("");
    const sel=MONTHLY[range],avg=BLN.map((_,i)=>Object.values(MONTHLY).reduce((a,m)=>a+m[i],0)/4);
    const W=640,H=250,l=50,r=14,t=26,b=28,mx=120000,xs=i=>l+i*(W-l-r)/11,ys=v=>H-b-(v/mx)*(H-b-t);
    let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tren sales ${range}"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".3"/><stop offset="1" stop-color="var(--accent)" stop-opacity=".02"/></linearGradient></defs>`;
    for(let g=0;g<=mx;g+=30000)s+=`<line x1="${l}" x2="${W-r}" y1="${ys(g)}" y2="${ys(g)}" stroke="var(--line)"/><text x="${l-8}" y="${ys(g)+4}" text-anchor="end">${g?"$"+g/1000+"rb":"0"}</text>`;
    BLN.forEach((m,i)=>s+=`<text x="${xs(i)}" y="${H-8}" text-anchor="middle">${m}</text>`);
    const line=sel.map((v,i)=>xs(i)+","+ys(v)).join(" ");
    s+=`<polygon points="${xs(0)},${ys(0)} ${line} ${xs(11)},${ys(0)}" fill="url(#ag)"/><polyline fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4" points="${avg.map((v,i)=>xs(i)+","+ys(v)).join(" ")}"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
    sel.forEach((v,i)=>s+=`<circle cx="${xs(i)}" cy="${ys(v)}" r="3.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"><title>${BLN[i]} ${range}: ${usd(v)}</title></circle>`);
    const tot=sel.reduce((a,c)=>a+c,0);s+=`<text class="lbl" x="${W-r}" y="14" text-anchor="end">Total ${range}: ${usd(tot)}</text>`;
    el.querySelector("#c3").innerHTML=s+"</svg>"};
  el.addEventListener("click",e=>{const b=e.target.closest("[data-range]");if(b){range=b.dataset.range;drawT()}});
  el.querySelector("#hr").addEventListener("input",drawH);drawH();drawT();
}

const DEMOS={bosDemo,ssDemo};

/* lightbox */
function openDoc(k){const d=DOCS[k];$("#lbi").src=d.img;$("#lbi").alt=d.title;$("#lbc").textContent=d.title+" · "+d.sub;$("#lb").hidden=false;$("#lbx").focus()}
function closeDoc(){$("#lb").hidden=true}
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb"||e.target.id==="lbx")closeDoc()});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#lb").hidden)closeDoc()});

/* routing: #tentang … #kontak, #finance, #pasar-modal, #project-<id>, #skill-<id> */
function setHash(h){if(location.hash.slice(1)!==h)history.replaceState(null,"","#"+h)}
function goTab(t){tab=t;if(t!=="project")detail=null;setHash(t);render();scrollTo({top:0})}
function fromHash(){
  const h=location.hash.slice(1);
  if(TRACKS[h]){track=h;tab="tentang";detail=null}
  else if(TABS.some(t=>t[0]===h)){tab=h;detail=null}
  else if(h.startsWith("project-")&&PROJECTS.some(p=>p.id===h.slice(8))){tab="project";detail=h.slice(8)}
  else if(h.startsWith("skill-")&&SKILLS.some(s=>s.id===h.slice(6))){tab="project";detail=null;fskill=h.slice(6);ftype="all"}
  render();
}
document.addEventListener("click",e=>{
  const dc=e.target.closest("[data-doc]");if(dc){openDoc(dc.dataset.doc);return}
  const t=e.target.closest("[data-tab]");if(t){goTab(t.dataset.tab);return}
  const tr=e.target.closest("[data-track]");if(tr){track=tr.dataset.track;setHash(track);render();return}
  const sk=e.target.closest("[data-skill]");if(sk){fskill=sk.dataset.skill;ftype="all";detail=null;tab="project";setHash("skill-"+fskill);render();scrollTo({top:0});return}
  const op=e.target.closest("[data-open]");if(op){detail=op.dataset.open;tab="project";setHash("project-"+detail);render();scrollTo({top:0});return}
  if(e.target.closest("[data-back]")){detail=null;setHash("project");render();return}
  if(e.target.closest("#reset")){ftype="all";fskill="all";setHash("project");render();return}
  const cp=e.target.closest("[data-copy]");if(cp){const done=()=>{cp.textContent="Tersalin";setTimeout(()=>cp.textContent="Salin",1500)};
    try{navigator.clipboard.writeText(cp.dataset.copy).then(done,()=>selectV(cp))}catch(_){selectV(cp)}}
});
document.addEventListener("change",e=>{
  if(e.target.id==="ft"){ftype=e.target.value;render()}
  if(e.target.id==="fs"){fskill=e.target.value;setHash(fskill==="all"?"project":"skill-"+fskill);render()}
});
$("#tabs").addEventListener("keydown",e=>{if(!["ArrowDown","ArrowUp","ArrowLeft","ArrowRight"].includes(e.key))return;e.preventDefault();const i=TABS.findIndex(t=>t[0]===tab),n=(i+(e.key==="ArrowDown"||e.key==="ArrowRight"?1:-1)+TABS.length)%TABS.length;goTab(TABS[n][0]);$("#tabs [aria-selected='true']").focus()});
function selectV(b){const v=b.parentElement.querySelector(".v");const r=document.createRange();r.selectNodeContents(v);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Teks dipilih"}
$("#theme").addEventListener("click",()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("theme",r.dataset.theme)}catch(_){}});
try{const th=localStorage.getItem("theme");if(th)document.documentElement.dataset.theme=th}catch(_){}
addEventListener("hashchange",fromHash);
fromHash();
</script>
